<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Submission Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f3136;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background-color: #36393f;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #7289da;
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b9bbbe;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #202225;
            background-color: #202225;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: 1px solid #7289da;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #7289da;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #5b73c7;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Roblox Portal</h2>
    
    <!-- REPLACE THE ACTION URL WITH YOUR FORMSPREE ENDPOINT -->
    <form action="https://formspree.io/f/xdeaeyno" method="POST">
        
        <!-- Discord Username -->
        <div class="input-group">
            <label for="discord-username">Discord Username</label>
            <input type="text" id="discord-username" name="Discord Username" placeholder="e.g., Wumpus" required>
        </div>

        <!-- Roblox User ID Field -->
        <div class="input-group">
            <label for="roblox-id">Enter Your Roblox User ID / Name</label>
            <input type="text" id="roblox-id" name="Roblox User ID" placeholder="e.g., Builderman or 12345678" required>
        </div>

        <!-- Additional Details -->
        <div class="input-group">
            <label for="message">Additional Message</label>
            <textarea id="message" name="Message Details" rows="4" placeholder="Any extra information..."></textarea>
        </div>

        <button type="submit">Submit Details</button>
    </form>
</div>

</body>
</html>
